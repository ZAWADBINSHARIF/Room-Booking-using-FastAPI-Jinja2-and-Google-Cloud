<!-- header include -->
{% include "partials/header.html" %}

<div class="add-room py-5">
  <h1 class="fw-bold">Add Room</h1>
  <div>
    <div class="w-50">
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="room_id"
          placeholder="Enter the room ID"
        />
        <label for="room_id">Enter the room ID</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="name"
          placeholder="Enter the room name"
        />
        <label for="name">Enter the room name</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="location"
          placeholder="Enter the room location"
        />
        <label for="location">Enter the room location</label>
      </div>
      <div class="d-flex justify-content-end">
        <button
          id="add-room-btn"
          type="button"
          class="btn btn-first fw-light fs-5"
        >
          Add Room
        </button>
      </div>
    </div>
  </div>
</div>

<script defer>
  const room_id = document.querySelector('#room_id');
  const room_name = document.querySelector('#name');
  const room_location = document.querySelector('#location');
  const addRoomBtn = document.querySelector('#add-room-btn');

  const user_id = `{{user_info["user_id"]}}`;

  addRoomBtn.addEventListener('click', async () => {
    const room_info = {
      user_id,
      room_id: room_id.value,
      name: room_name.value,
      location: room_location.value,
    };

    try {
      const response = await fetch('/room/add', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
        },
        body: JSON.stringify(room_info),
      });

      if (response.status === 409) {
        room_id.classList.add('is-invalid');
      } else if (response.status === 201) {
        window.location = '/';
      }
    } catch (error) {
      console.log(error);
    }
  });
</script>
