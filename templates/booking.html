<!-- header include -->
{% include "partials/header.html" %} {{bookings}}
<h1 class="pt-5 fw-bold">Booking</h1>
<h5>Search and Book a room using a given day and time</h5>
<div class="pt-4">
  <div class="mb-3 w-50">
    <label for="from" class="form-label">From</label>
    <input
      type="datetime-local"
      class="form-control"
      id="from"
      value="{{start_date}}"
    />
    <label for="to" class="form-label">To</label>
    <input
      type="datetime-local"
      class="form-control"
      id="to"
      value="{{end_date}}"
    />
  </div>
  <button id="searchBtn" class="btn btn-first">Search</button>

  <div class="d-flex flex-wrap gap-3 py-3">
    {% if all_rooms and user_info %} {% for room in all_rooms%}
    <div class="card" style="width: 18rem">
      <div class="card-header">Name: {{room.name}}</div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item">Location: {{room.location}}</li>
        <li class="list-group-item text-end">
          <button
            class="btn-first btn"
            onclick="handleBooking('{{room.name}}', '{{user_info["user_id"]}}', '{{start_date}}', '{{end_date}}')"
          >
            Book
          </button>
        </li>
      </ul>
    </div>
    {% endfor %} {% endif %}
  </div>
</div>

<script>
  const searchBtn = document.getElementById('searchBtn');

  async function handleBooking(room_id, user_id, from_date, to_date) {
    try {

      console.log(JSON.stringify({
          room_id,
          user_id, 
          from_date, 
          to_date
        }))

      const response = await fetch('/room/add-booking', {
        method: 'post',
        headers: {
          'content-type': 'application/json',
        },
        body: JSON.stringify({
          room_id,
          user_id, 
          from_date, 
          to_date
        })
      });

      if(response.status == 201){
        location.reload();
      }

    } catch (error) {
      console.log(error);
    }
  }

  searchBtn.addEventListener('click', async () => {
    const from = document.getElementById('from').value;
    const to = document.getElementById('to').value;

    if (!from && !to) {
      return;
    }

    const queryUrl = new URLSearchParams({
      from_date: new Date(from).getTime(),
      to_date: new Date(to).getTime(),
      start_date: from,
      end_date: to,
    });

    window.location.replace(`/booking?${queryUrl}`);
  });
</script>
